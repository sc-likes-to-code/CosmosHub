name: Scheduled RSS Ingestion & Archival

on:
  schedule:
    # 09:00 AM IST = 03:30 UTC
    - cron: '30 3 * * *'
    # 11:20 PM IST = 17:50 UTC
    - cron: '50 17 * * *'
  workflow_dispatch:
    inputs:
      collection_type:
        description: 'Collection run type'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
      dry_run:
        description: 'Dry run (simulate without writing files or committing)'
        required: false
        default: false
        type: boolean

concurrency:
  group: 'rss-ingestion-archive'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-and-archive:
    name: RSS Ingestion & Daily Archive
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Verify production build
        run: npm run build

      - name: Run RSS News Ingestion Pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_COLLECTION: ${{ github.event.inputs.collection_type || '' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          COLLECTION_ARG="auto"
          if [ "$EVENT_NAME" = "schedule" ]; then
            CRON_STR=$(echo "$SCHEDULE_CRON" | xargs)

            if [ "$CRON_STR" = "30 3 * * *" ]; then
              COLLECTION_ARG="morning"
            elif [ "$CRON_STR" = "50 17 * * *" ]; then
              COLLECTION_ARG="evening"
            fi
          elif [ -n "$INPUT_COLLECTION" ] && [ "$INPUT_COLLECTION" != "auto" ]; then
            COLLECTION_ARG="$INPUT_COLLECTION"
          fi

          DRY_ARG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_ARG="--dry-run"
          fi

          echo "Executing ingestion with collection=$COLLECTION_ARG, event=$EVENT_NAME"
          node scripts/ingest.js --collection "$COLLECTION_ARG" $DRY_ARG --summary-file "$GITHUB_STEP_SUMMARY"

      
      - name: Create Commits & Push Archive Changes
        if: ${{ inputs.dry_run != true }}
        env:
          COMMIT_AUTHOR_EMAIL: ${{ secrets.COMMIT_AUTHOR_EMAIL }}
        run: |
          if [ -z "$COMMIT_AUTHOR_EMAIL" ]; then
            echo "Error: COMMIT_AUTHOR_EMAIL secret is not configured."
            exit 1
          fi

          git config user.name "sc-likes-to-code"
          git config user.email "$COMMIT_AUTHOR_EMAIL"

          node scripts/commit-archive.js

          BRANCH_NAME="${GITHUB_REF_NAME}"
          PUSHED=false

          for attempt in 1 2 3; do
            echo "Attempt $attempt to push archive commits to $BRANCH_NAME..."

            if git push origin "HEAD:$BRANCH_NAME"; then
              PUSHED=true
              echo "Push successful."
              break
            fi

            echo "Push rejected; synchronizing with remote..."
            git fetch origin "$BRANCH_NAME"

            if ! git rebase "origin/$BRANCH_NAME"; then
              echo "Rebase conflict detected. Aborting."
              git rebase --abort
              exit 1
            fi
          done

          if [ "$PUSHED" != "true" ]; then
            echo "Failed to push after 3 attempts."
            exit 1
          fi
